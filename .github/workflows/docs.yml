name: Publish monograph and documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      archive_needed: ${{ steps.archive.outputs.needed }}
    steps:
      - name: Checkout with short history
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Detect archive-only merge
        id: publication
        shell: bash
        run: |
          if git diff --name-only HEAD^ HEAD -- docs/.publication.json | grep -q '^docs/.publication.json$'; then
            echo "archive_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "archive_only=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare edition, date and changelog for changed main
        if: github.ref == 'refs/heads/main'
        env:
          EVENT: ${{ github.event_name }}
          ARCHIVE_ONLY: ${{ steps.publication.outputs.archive_only }}
        run: |
          if [ "$ARCHIVE_ONLY" = "true" ]; then
            python tools/release.py --repo . --event workflow_dispatch
          else
            python tools/release.py --repo . --event "$EVENT"
          fi
      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
      - name: Install Python requirements
        run: |
          python -m pip install -r requirements.txt -r tools/requirements.txt
      - name: Install Chromium for PDF rendering
        run: python -m playwright install --with-deps chromium
      - name: Generate and verify monograph, wiki and PDF
        run: bash tools/ci-build.sh
      - name: Archive PDF edition for publication
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          version=$(python -c 'import pathlib,re; s=pathlib.Path("Monografie_AI_De_la_Chat_la_Sisteme_Agentice.md").read_text(); print(re.search(r"^edition: \"([^\"]+)\"",s,re.M).group(1))')
          historic="docs/Monografie_AI_De_la_Chat_la_Sisteme_Agentice_${version}.pdf"
          if git ls-files --error-unmatch "$historic" >/dev/null 2>&1; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            python tools/archive_pdf.py --repo . --reuse-existing
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            python tools/archive_pdf.py --repo .
          fi
      - name: Stage verified release files as artifact
        if: steps.archive.outputs.needed == 'true' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: archive-staging
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: error
          path: |
            Monografie_AI_De_la_Chat_la_Sisteme_Agentice.md
            docs/README.md
            docs/.publication.json
            docs/Monografie_AI_De_la_Chat_la_Sisteme_Agentice*.pdf
            wiki/**/*.md
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  archive_pr:
    if: github.event_name == 'push' && needs.build.outputs.archive_needed == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout validated merge
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Download verified release files
        uses: actions/download-artifact@v4
        with:
          name: archive-staging
          path: .
      - name: Open archive PR respecting main protection
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/open_archive_pr.sh
