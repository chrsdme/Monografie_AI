name: Validate Monografie Studio

on:
  push:
    branches: [studio-test]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-studio:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
      - name: Install Python requirements
        run: python -m pip install -r requirements.txt -r tools/requirements.txt
      - name: Install Chromium for PDF and browser checks
        run: python -m playwright install --with-deps chromium
      - name: Run complete unittest suite
        run: python -m unittest discover -s tests -v
      - name: Verify Studio manifest round-trip
        run: python tools/studio.py --repo . assemble
      - name: Build through the Studio path
        env:
          STUDIO_RELEASE_ENABLED: "true"
          STUDIO_RELEASE_ACTIVE: "false"
        run: python tools/studio.py --repo . build --pdf
      - name: Build and verify site, PDF, links and browser rendering
        env:
          STUDIO_RELEASE_ENABLED: "true"
          STUDIO_RELEASE_ACTIVE: "false"
        run: bash tools/ci-build.sh
