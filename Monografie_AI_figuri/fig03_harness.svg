<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="400px" version="1.1" viewBox="0 0 1200 400" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="id3" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="12" orient="auto" refX="11" refY="6"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#42536D" /></marker></defs><rect fill="#FFFFFF" height="400" width="1200" x="0" y="0" /><rect fill="#15253E" height="6" width="1200" x="0" y="0" /><text fill="#15253E" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="bold" x="48" y="50">Motor de inferenta si harness</text><text fill="#42536D" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" x="48" y="77">Generarea si executia controlata au responsabilitati distincte</text><rect fill="#F2EBFF" height="141" rx="11" ry="11" stroke="#9983C4" stroke-width="1.8" width="280" x="66" y="133" /><text fill="#17253A" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="206.0" y="163">Motor de inferenta</text><text fill="#42536D" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" text-anchor="middle" x="206.0" y="186">Model, tokeni, generare</text><text fill="#42536D" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" text-anchor="middle" x="206.0" y="207">estimare si raspuns</text><rect fill="#E6F0FF" height="141" rx="11" ry="11" stroke="#6F96CD" stroke-width="1.8" width="292" x="452" y="133" /><text fill="#17253A" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="598.0" y="163">Harness</text><text fill="#42536D" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" text-anchor="middle" x="598.0" y="186">Instrumente si permisiuni</text><text fill="#42536D" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" text-anchor="middle" x="598.0" y="207">stare, bucla si observabilitate</text><rect fill="#E8F7F2" height="141" rx="11" ry="11" stroke="#76BCA5" stroke-width="1.8" width="286" x="853" y="133" /><text fill="#17253A" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="996.0" y="163">Sistem extern</text><text fill="#42536D" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" text-anchor="middle" x="996.0" y="186">Fisiere, API, teste</text><text fill="#42536D" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" text-anchor="middle" x="996.0" y="207">date si efecte reale</text><line marker-end="url(#id3)" stroke="#42536D" stroke-width="2.4" x1="346" x2="451" y1="200" y2="200" /><line marker-end="url(#id3)" stroke="#42536D" stroke-width="2.4" x1="745" x2="852" y1="200" y2="200" /><text fill="#42536D" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" x="68" y="315">Motorul propune. Runtime-ul poate valida si aplica actiuni.</text><text fill="#42536D" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" x="68" y="345">O cerere de tool nu inseamna ca efectul extern s-a produs.</text></svg>