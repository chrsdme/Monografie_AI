name: Publish monograph and documentation

on:
  push:
    branches: [main]
    paths:
      - "Monografie_AI_De_la_Chat_la_Sisteme_Agentice.md"
      - "Monografie_AI_figuri/**"
      - "wiki/**"
      - "tools/**"
      - "mkdocs.yml"
      - "requirements.txt"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
      - name: Install Python requirements
        run: |
          python -m pip install -r requirements.txt -r tools/requirements.txt
      - name: Install Chromium for PDF rendering
        run: python -m playwright install --with-deps chromium
      - name: Generate and verify monograph, wiki and PDF
        run: bash tools/ci-build.sh
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
