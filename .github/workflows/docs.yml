name: Publish monograph and documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: Checkout with short history
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare edition, date and changelog for changed main
        if: github.ref == 'refs/heads/main'
        env:
          EVENT: ${{ github.event_name }}
        run: python tools/release.py --repo . --event "$EVENT"
      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
      - name: Install Python requirements
        run: |
          python -m pip install -r requirements.txt -r tools/requirements.txt
      - name: Install Chromium for PDF rendering
        run: python -m playwright install --with-deps chromium
      - name: Generate and verify monograph, wiki and PDF
        run: bash tools/ci-build.sh
      - name: Archive edition in docs and update published PDF
        if: github.ref == 'refs/heads/main'
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            python tools/archive_pdf.py --repo . --reuse-existing
          else
            python tools/archive_pdf.py --repo .
          fi
      - name: Commit validated metadata, wiki and PDF archives
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          version=$(python -c 'import pathlib,re; s=pathlib.Path("Monografie_AI_De_la_Chat_la_Sisteme_Agentice.md").read_text(); print(re.search(r"^edition: \"([^\"]+)\"",s,re.M).group(1))')
          name="Monografie_AI_De_la_Chat_la_Sisteme_Agentice"
          git add -- "${name}.md" "docs/README.md" "docs/${name}.pdf" "docs/${name}_${version}.pdf"
          git add -- ':(glob)wiki/*.md' ':(glob)wiki/**/*.md'
          if git diff --cached --quiet; then
            echo "No publication commit needed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(release): archive edition ${version} [skip ci]"
            git push origin HEAD:main
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
